<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El color del fondo (--mesa, rgb 244 246 244): es lo que se ve arriba en
         la portada de acceso y en el portal. Dentro del panel, AppShell lo
         cambia al blanco de la barra superior. -->
    <meta name="theme-color" content="#f4f6f4" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Panel de correo: dominios, buzones, alias y entregabilidad." />
    <!-- Logotipo de Mailway. El SVG es la fuente; el ICO (16, 32 y 48 px) es
         para los navegadores sin favicon SVG (Safari) y el PNG, a sangre,
         para la pantalla de inicio del iPhone. Los dominios de marca blanca
         del panel sirven esta misma web. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mailway</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
