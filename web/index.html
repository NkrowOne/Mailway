    <!--
    THESIS: el panel de correo como INFORME DE LABORATORIO. Todo dato es una
    medición con su rango de referencia y su veredicto: SPF, DKIM, reputación
    de la IP, uso del plan, cola de salida. Refusa el admin oscuro con un
    acento neón y tarjetas iguales (el mundo anterior de este mismo producto),
    y refusa también su lectura literal del nombre (etiquetas postales,
    sellos, códigos de barras): la metáfora decoraba en vez de trabajar.
    OWN-WORLD: mesa de estraza clara y hoja blanca de informe; estructura
    llevada por FILETES (regla pesada bajo cabecera, hairline entre filas),
    nunca por cajas ni sombras; tinta cálida casi negra; petróleo de
    laboratorio (#0F4C52) solo en membrete, marca y navegación activa; color
    clínico (verde/ámbar/carmín) EXCLUSIVAMENTE como veredicto de un valor
    fuera de rango; Archivo para voz, Archivo Narrow en versalitas de columna,
    Azeret Mono con cifras tabulares para todo lo medido o copiable.
    STORY: el operador abre el parte, ve de un vistazo qué está fuera de rango,
    lee el valor medido junto a su referencia y ejecuta la acción que lo
    devuelve al rango; el cliente ve su propio parte, sin vocabulario técnico.
    FIRST VIEWPORT: membrete del informe (instancia, fecha y hora de la
    medición) sobre filete petróleo; debajo, la tabla de constantes con las
    filas fuera de rango arrastradas arriba y su veredicto en el margen
    derecho; la acción vive al final de la fila que la reclama, no en una
    barra de botones.
    FORM: informe de análisis clínico; candidata 1 de 7 de mi lista ordenada
    por resonancia (el sorteo de dirección salió degradado: el script no
    emitió asignación, declarado al usuario); elegida por el usuario entre
    cuatro cartas.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
    the finish review, the verdict, and DESIGN.md.
    -->
