# Pasarela de Mailway delante de Bulwark (nginx). Detalle en deploy/bulwark/README.md.
#
#   Internet → (Cloudflare) → Traefik → esta pasarela :8080 → Bulwark :3000
#
# Por qué existe: el puente de Traefik de Skyway solo admite reglas Host() y
# la redirección a HTTPS, así que ni la ruta ni las cabeceras se pueden
# filtrar en Traefik. Aquí se hace:
#   - 404 en la administración y el asistente de Bulwark (y en lo equivalente)
#     para el tráfico público. El panel llega a la API de administración
#     directamente por la red interna (http://mailway-bulwark:3000).
#   - IP real: Bulwark recibe UNA sola IP en X-Forwarded-For y la toma tal
#     cual (TRUSTED_PROXY_DEPTH=1).
#   - Host y X-Forwarded-Host intactos: Bulwark elige la marca de cada
#     cliente por el nombre (domainBranding).
#   - Límite de peticiones en las comprobaciones de credenciales de Bulwark
#     (ver «Comprobación de credenciales»).
#   - HSTS, límites de tamaño y de tiempo, y un registro sin credenciales.
#
# Se monta la carpeta deploy/bulwark/nginx en /etc/nginx/mailway (solo
# lectura) y se arranca con «nginx -c /etc/nginx/mailway/nginx.conf». Las
# rutas temporales van a /tmp para que el contenedor funcione con el sistema
# de ficheros en solo lectura (tmpfs en /tmp).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    server_tokens off;

    client_body_temp_path /tmp/nginx-cuerpos;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # DNS de Docker. El nombre de Bulwark se resuelve en cada consulta (y no
    # una sola vez al arrancar): si su contenedor se recrea con otra IP, la
    # pasarela lo sigue encontrando sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream bulwark {
        zone bulwark 64k;
        server mailway-bulwark:3000 resolve;
        keepalive 16;
    }

    # ----------------------------------------------------------- IP real --

    # ¿Quién conecta con la pasarela? Solo Traefik, por una red de Docker:
    # sus cabeceras se creen. Una conexión desde fuera de esas redes no las
    # trae de nadie de confianza y se toma su propia IP.
    geo $mw_par_confiable {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1            1;
        fc00::/7       1;
    }

    # Último salto de X-Forwarded-For: la IP que conectó con Traefik. Traefik
    # lo escribe siempre (y, sin trustedIPs, descarta lo que traía la
    # petición), así que el visitante no puede falsearlo.
    map $http_x_forwarded_for $mw_ultimo_salto {
        default "";
        "~(?:^|,)[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*$" $ip;
    }

    # Salto anterior al último: si el último es un nodo de Cloudflare, es la
    # IP del visitante tal como la vio Cloudflare (que añade la suya detrás de
    # lo que traiga la petición). Solo existe si Traefik conserva el
    # X-Forwarded-For de Cloudflare (trustedIPs con sus rangos); el Traefik de
    # Skyway lo reescribe y entonces el visitante solo llega en CF-Connecting-IP.
    map $http_x_forwarded_for $mw_salto_anterior {
        default "";
        "~(?:^|,)[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*,[ \t]*[0-9A-Fa-f.:]+[ \t]*$" $ip;
    }

    # El visitante según Cloudflare. Solo vale si el último salto es de
    # Cloudflare: cualquiera puede conectar con el servidor sin pasar por él
    # y escribir esta cabecera.
    map $http_cf_connecting_ip $mw_visitante_cloudflare {
        default "";
        "~^[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*$" $ip;
    }

    geo $mw_ultimo_salto $mw_ultimo_es_cloudflare {
        default 0;
        include /etc/nginx/mailway/cloudflare.conf;
    }

    # Clave: «par de confianza:último es Cloudflare|salto anterior|CF-Connecting-IP|último».
    # Las expresiones se prueban en orden; sin coincidencia, la IP que conecta.
    map "$mw_par_confiable:$mw_ultimo_es_cloudflare|$mw_salto_anterior|$mw_visitante_cloudflare|$mw_ultimo_salto" $mw_ip_real {
        default                              $remote_addr;
        # No llega de Traefik: su propia IP, sin creer ninguna cabecera.
        "~^0:"                               $remote_addr;
        # Último salto ajeno a Cloudflare: ese salto.
        "~^1:0\|[^|]*\|[^|]*\|(?<u>[^|]+)$"  $u;
        # Por Cloudflare, con el salto anterior: el visitante según Cloudflare.
        "~^1:1\|(?<a>[^|]+)\|"               $a;
        # Por Cloudflare, sin salto anterior (Traefik reescribe la cabecera).
        "~^1:1\|\|(?<c>[^|]+)\|"             $c;
        # Por Cloudflare sin datos del visitante: el nodo de Cloudflare. No se
        # inventa nada, aunque agrupe a muchos visitantes bajo una IP.
        "~^1:1\|\|\|(?<u>[^|]+)$"            $u;
    }

    map "$mw_par_confiable:$http_x_forwarded_proto" $mw_proto {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # --------------------------------------- Comprobación de credenciales --

    # /api/auth/verify, /api/auth/stalwart-context y /api/auth/session
    # comprueban la contraseña contra el motor DESDE BULWARK, que está en la
    # red exenta del bloqueo automático: el motor ni banea ni cuenta esos
    # fallos para el buzón. Bulwark 1.13 solo limita /api/auth/verify; las
    # otras dos responden 401 o 200 sin límite (comprobado en el ensayo), un
    # oráculo de contraseñas. Hasta que Bulwark lo corrija, el límite está
    # aquí: por IP real y para toda la instancia, solo en POST y PUT (una
    # clave vacía no cuenta, así que las lecturas no gastan). Un acceso normal
    # hace dos o tres de estas peticiones; una oficina tras una sola IP cabe
    # holgadamente en 20 por minuto con ráfagas de 40.
    map "$request_method:$mw_ip_real" $mw_clave_credenciales {
        default "";
        "~^(?:POST|PUT):(?<ip>.+)$" $ip;
    }
    map $request_method $mw_clave_credenciales_instancia {
        default "";
        POST    instancia;
        PUT     instancia;
    }
    limit_req_zone $mw_clave_credenciales zone=mw_credenciales_ip:10m rate=20r/m;
    limit_req_zone $mw_clave_credenciales_instancia zone=mw_credenciales_instancia:1m rate=180r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # ---------------------------------------------------------- Registro --

    # Una línea JSON por petición. Solo la ruta ($uri, sin la cadena de
    # consulta): el acceso con token (?token=…) y la vuelta de OAuth (?code=…)
    # llevan secretos en ella. Nunca cabeceras (Authorization, Cookie).
    log_format mailway escape=json
        '{"hora":"$time_iso8601","ip":"$mw_ip_real","par":"$remote_addr",'
        '"host":"$host","metodo":"$request_method","ruta":"$uri",'
        '"estado":$status,"bytes":$body_bytes_sent,"duracion":$request_time}';

    server {
        listen 8080 default_server;
        server_name _;

        access_log /dev/stdout mailway;

        # El correo y sus adjuntos van del navegador al motor (JMAP), no por
        # aquí. Por la pasarela solo pasan la propia aplicación, los ajustes
        # sincronizados y la proxy WebDAV de Bulwark (Archivos y calendarios):
        # el tope es el del mensaje de Mailway (30 MB).
        client_max_body_size 30m;
        client_body_buffer_size 128k;
        # Las cookies de sesión de Bulwark van cifradas y, con varias cuentas
        # en el mismo navegador, ocupan varios kilobytes.
        large_client_header_buffers 8 32k;
        client_header_timeout 30s;
        client_body_timeout 60s;
        send_timeout 120s;
        keepalive_timeout 75s;

        # Traefik termina TLS y el puerto 80 solo redirige: el navegador debe
        # volver siempre por HTTPS. Sin includeSubDomains: el dominio es del
        # cliente y sus otros nombres no son cosa de Mailway.
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $mw_proto;
        proxy_set_header X-Forwarded-For $mw_ip_real;
        proxy_set_header X-Real-IP $mw_ip_real;
        # Nada más que diga quién es el visitante: solo cuenta la IP de arriba.
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Port "";
        proxy_hide_header X-Powered-By;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # La CSP de Bulwark, con su nonce, y las Set-Cookie no caben en el
        # búfer por defecto (502 «upstream sent too big header»).
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        # Lo que no quepa en memoria se pasa sin guardarlo en disco.
        proxy_max_temp_file_size 0;

        # Acciones de servidor de Next.js: se invocan con un POST a CUALQUIER
        # página y la cabecera Next-Action, así que el bloqueo por ruta no las
        # alcanzaría. Bulwark 1.13 no tiene ninguna; si una versión las añade,
        # hay que revisarlas antes de dejarlas pasar (ver README).
        if ($http_next_action) {
            return 404;
        }

        # Los bloqueos comparan la ruta ya normalizada por nginx (%XX
        # decodificados, «//» y «/./» resueltos), la misma que enruta Next.js:
        # /api/%61dmin no se cuela. Sin distinguir mayúsculas, por si acaso.

        # Administración de Bulwark y asistente de puesta en marcha.
        location ~* ^/(?:admin|setup)(?:/|$) {
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        # API del asistente; el proxy JMAP de desarrollo (la imagen no lo trae);
        # el paso a los métodos x: de Stalwart con la sesión del usuario
        # (contraseña, contraseñas de aplicación y 2FA: van por «Mi buzón»).
        location ~* ^/api/(?:setup|dev-jmap|account)(?:/|$) {
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        # Peticiones del servidor de Bulwark a terceros en nombre del usuario,
        # que su política no puede apagar (en 1.13 no aplica «defaults»):
        # /api/favicon pide el icono de cada dominio que escribe al buzón (el
        # remitente sabría cuándo se ve su correo y la IP del servidor) y
        # /api/translate envía el texto a MyMemory (solo lo usa el complemento
        # de traducción, desactivado). Sin el favicon, Bulwark muestra iniciales.
        location ~* ^/api/(?:favicon|translate)(?:/|$) {
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        # Suplantación con JWT y cuenta maestra del motor: Mailway no la usa.
        # (Antes que la regla general de /api/auth/: gana la primera que coincide.)
        location ~* ^/api/auth/impersonate(?:/|$) {
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        # Acceso al buzón: con el límite de arriba.
        location ~* ^/api/auth/ {
            limit_req zone=mw_credenciales_ip burst=40 nodelay;
            limit_req zone=mw_credenciales_instancia burst=180 nodelay;
            proxy_pass http://bulwark;
        }

        # API de administración, salvo tres lecturas públicas que el propio
        # correo web necesita (Bulwark no las protege por diseño): la política
        # (sin ella, el navegador vuelve a la política por defecto y pierde la
        # de Mailway), los recursos de marca subidos y el CSS de los temas.
        location ~* ^/api/admin(?:/|$) {
            location ~ ^/api/admin/policy$ {
                if ($request_method !~ ^(?:GET|HEAD)$) {
                    return 404;
                }
                proxy_pass http://bulwark;
            }
            location ~ ^/api/admin/branding/[A-Za-z0-9][A-Za-z0-9._-]*$ {
                if ($request_method !~ ^(?:GET|HEAD)$) {
                    return 404;
                }
                proxy_pass http://bulwark;
            }
            location ~ ^/api/admin/themes/[a-z0-9-]+/css$ {
                if ($request_method !~ ^(?:GET|HEAD)$) {
                    return 404;
                }
                proxy_pass http://bulwark;
            }
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        location / {
            proxy_pass http://bulwark;
        }
    }

    # Salud de la propia pasarela (healthcheck del contenedor), solo dentro
    # del contenedor.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /salud {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
