# ============================================================================
# Mailway completo SIN Skyway — panel + motor + webmail en un solo compose
# ----------------------------------------------------------------------------
# Para un servidor sin Skyway. Forma recomendada:
#   sudo bash deploy/instalar.sh --sin-skyway
#
# A mano:
#   cp deploy/.env.example deploy/.env      # y rellena las variables
#   docker compose -f deploy/docker-compose.standalone.yml --profile proxy up -d --build
#
# Con el perfil `proxy` se levanta además un Traefik propio en 80/443 que da
# HTTPS (Let's Encrypt) al panel, al webmail y a la web del motor, y sirve los
# dominios de marca blanca de los clientes. Sin ese perfil, el panel
# (127.0.0.1:4100), el webmail (127.0.0.1:8000) y la web del motor
# (127.0.0.1:8080, a través de su pasarela) solo escuchan en local, para
# ponerles delante un proxy propio (Caddy, Nginx…) con TLS. No se publican en
# HTTP hacia Internet: por ellos viajan contraseñas.
#
# Pasarela del motor (mailway-mail-gw) y perfil `bulwark` (Bulwark, el correo
# web «beta» por cliente, solo con Stalwart 0.16 y solo si se activa con
# «sudo mailway bulwark on»): como en docker-compose.mail.yml.
#
# Los puertos de correo (25, 465, 587, 993, 4190) van directos al host.
#
# Motor (MAILWAY_MOTOR en deploy/.env): igual que en docker-compose.mail.yml,
# lo propio de cada versión de Stalwart vive en motor/<motor>/compose.yml.
# Las instalaciones nuevas usan stalwart-0.16; las anteriores siguen en
# stalwart-0.15 hasta que se migran con «sudo mailway migrar-motor». Con la
# 0.16, el certificado de IMAP/SMTP sale del Traefik del perfil `proxy` (con
# el extractor, perfil `tls`): sin ese Traefik, el motor no tiene de dónde
# sacarlo.
#
# Diagnóstico de la pila (no cambia nada) y prueba de acceso a un buzón:
#   sudo bash deploy/instalar.sh --comprobar
#   sudo bash deploy/instalar.sh --probar-acceso
#
# Versiones exactas en todas las imágenes, como en docker-compose.mail.yml:
# las nuevas llegan como PR de Dependabot que la CI prueba antes de fusionar.
# ============================================================================

name: mailway

services:
  mailway-panel:
    build: ..
    image: mailway-panel:local
    container_name: mailway-panel
    restart: unless-stopped
    ports:
      - '127.0.0.1:4100:4100'
    environment:
      STALWART_URL: http://mailway-mail:8080
      STALWART_ADMIN_USER: admin
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?Define STALWART_ADMIN_PASSWORD en deploy/.env}
      STALWART_SMTP_HOST: mailway-mail
      STALWART_SMTP_PORT: '587'
      # La API de envío entra por el SMTP interno (mailway-mail:587) y
      # verifica su certificado contra MAIL_HOSTNAME. Solo mientras el motor
      # no tenga certificado válido (sin proxy ni Cloudflare) puede ponerse a
      # 1 en deploy/.env para aceptar el autofirmado; retíralo después.
      MAILWAY_SMTP_ALLOW_SELF_SIGNED: ${MAILWAY_SMTP_ALLOW_SELF_SIGNED:-}
      MAILWAY_SECRET: ${MAILWAY_SECRET:-}
      MAILWAY_SETUP_TOKEN: ${MAILWAY_SETUP_TOKEN:-}
      MAILWAY_TRAEFIK_TOKEN: ${MAILWAY_TRAEFIK_TOKEN:-}
      MAILWAY_WEBMAIL_TOKEN: ${MAILWAY_WEBMAIL_TOKEN:-}
      MAILWAY_MAIL_HOSTNAME: ${MAIL_HOSTNAME:?Define MAIL_HOSTNAME en deploy/.env}
      MAILWAY_PUBLIC_IP: ${MAILWAY_PUBLIC_IP:-}
      MAILWAY_PANEL_URL: ${MAILWAY_PANEL_URL:-https://${PANEL_HOSTNAME}}
      MAILWAY_WEBMAIL_URL: ${MAILWAY_WEBMAIL_URL:-https://${WEBMAIL_HOSTNAME}}
      # Destinos de las rutas de marca blanca que el panel publica a Traefik.
      MAILWAY_PANEL_BACKEND_URL: http://mailway-panel:4100
      MAILWAY_WEBMAIL_BACKEND_URL: http://mailway-webmail:80
      MAILWAY_TRAEFIK_CERTRESOLVER: le
      MAILWAY_ENGINE_TRUSTED_NETWORK: ${MAILWAY_INTERNAL_SUBNET:-10.203.53.0/24}
      # Bulwark (perfil `bulwark`): el instalador escribe en deploy/.env las dos
      # direcciones solo mientras está activado; vacías, el panel no lo ofrece
      # y sus clientes siguen en Roundcube. La contraseña es la de Bulwark.
      MAILWAY_BULWARK_URL: ${MAILWAY_BULWARK_URL:-}
      MAILWAY_BULWARK_ADMIN_PASSWORD: ${MAILWAY_BULWARK_URL:+${BULWARK_ADMIN_PASSWORD:-}}
      MAILWAY_BULWARK_BACKEND_URL: ${MAILWAY_BULWARK_BACKEND_URL:-}
    volumes:
      - mailway-panel-data:/data
    networks:
      - mailway-internal
      - mailway-edge
    depends_on:
      mailway-mail:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=mailway-edge
      - traefik.http.routers.mailway-panel.rule=Host(`${PANEL_HOSTNAME:?Define PANEL_HOSTNAME en deploy/.env}`)
      - traefik.http.routers.mailway-panel.entrypoints=web
      - traefik.http.middlewares.mailway-panel-https.redirectscheme.scheme=https
      - traefik.http.middlewares.mailway-panel-https.redirectscheme.permanent=true
      - traefik.http.routers.mailway-panel.middlewares=mailway-panel-https
      - traefik.http.routers.mailway-panel-secure.rule=Host(`${PANEL_HOSTNAME}`)
      - traefik.http.routers.mailway-panel-secure.entrypoints=websecure
      - traefik.http.routers.mailway-panel-secure.tls.certresolver=le
      - traefik.http.services.mailway-panel.loadbalancer.server.port=4100

  mailway-mail:
    # Imagen, credenciales, volúmenes, rutas de Traefik y comprobación de
    # salud: las del motor elegido (ver la cabecera).
    extends:
      file: motor/${MAILWAY_MOTOR:-stalwart-0.15}/compose.yml
      service: mailway-mail
    container_name: mailway-mail
    # Sin esto Stalwart se identifica con el ID del contenedor.
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    ports:
      - '25:25'
      - '465:465'
      - '587:587'
      - '993:993'
      - '4190:4190'
    networks:
      mailway-internal:
        ipv4_address: ${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
      mailway-edge: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=mailway-edge

  # Pasarela HTTP del motor (motor/pasarela/nginx.conf): por ella llega al
  # motor todo lo que entra por HTTP, con la IP real como única dirección de
  # X-Forwarded-For y sin la cabecera Forwarded. Ver docker-compose.mail.yml.
  mailway-mail-gw:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: mailway-mail-gw
    restart: unless-stopped
    command: ['nginx', '-c', '/etc/nginx/mailway/nginx.conf', '-g', 'daemon off;']
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports:
      # Web del motor, solo desde el propio servidor (o por el proxy): un proxy
      # propio delante entra también por la pasarela.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./motor/pasarela:/etc/nginx/mailway:ro
    networks:
      - mailway-edge
    labels:
      - mailway.mail-gw-config=${MAILWAY_MAIL_GW_HASH:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/salud']
      interval: 30s
      timeout: 5s
      retries: 3

  mailway-webmail:
    image: roundcube/roundcubemail:1.7.4-apache
    container_name: mailway-webmail
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:80'
    depends_on:
      mailway-mail:
        condition: service_healthy
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailway-mail
      ROUNDCUBEMAIL_DEFAULT_PORT: '993'
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mailway-mail
      ROUNDCUBEMAIL_SMTP_PORT: '465'
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,password,markasjunk,newmail_notifier,attachment_reminder,emoticons,vcard_attachments,hide_blockquote,identity_select,mailway_cuentas,mailway_perfil,mailway_sesion,mailway_theme
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:?Define ROUNDCUBE_DES_KEY (24 caracteres) en deploy/.env}
      MAILWAY_BRAND: ${MAILWAY_BRAND:-Webmail}
      MAILWAY_PANEL_URL: ${MAILWAY_PANEL_URL:-https://${PANEL_HOSTNAME}}
      MAILWAY_PANEL_INTERNAL_URL: ${MAILWAY_PANEL_INTERNAL_URL:-http://mailway-panel:4100}
      MAILWAY_WEBMAIL_TOKEN: ${MAILWAY_WEBMAIL_TOKEN:-}
    extra_hosts:
      # Siempre por la subred interna, la exenta del bloqueo automático.
      - mailway-mail:${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
    volumes:
      - mailway-webmail-db:/var/roundcube/db
      - ./roundcube/mailway.php:/var/roundcube/config/mailway.php:ro
      # Capa visual de Mailway sobre Elastic (solo aspecto; ver roundcube/README.md).
      - ./roundcube/mailway_theme:/var/www/html/plugins/mailway_theme:ro
      # Nombre visible y foto del buzón desde el panel (ver roundcube/README.md).
      - ./roundcube/mailway_perfil:/var/www/html/plugins/mailway_perfil:ro
      # Cierre de sesión con aviso si la contraseña cambia por fuera (ver roundcube/README.md).
      - ./roundcube/mailway_sesion:/var/www/html/plugins/mailway_sesion:ro
      # Cambio de dominio: entrar con la dirección vieja o la nueva y conservar
      # contactos, firmas y preferencias (ver roundcube/README.md).
      - ./roundcube/mailway_cuentas:/var/www/html/plugins/mailway_cuentas:ro
      # Diagnóstico de instalar.sh --comprobar y --probar-acceso (fuera de la
      # raíz web y de /var/roundcube/config).
      - ./roundcube/diagnostico:/opt/mailway:ro
    networks:
      - mailway-internal
      - mailway-edge
    labels:
      - traefik.enable=true
      # Huella de roundcube/mailway.php (la pone el instalador): se monta como
      # fichero suelto y, tras «git pull», el contenedor seguiría leyendo la
      # versión anterior. Si cambia, Compose recrea el webmail.
      - mailway.roundcube-config=${MAILWAY_ROUNDCUBE_CONFIG_HASH:-}
      - traefik.docker.network=mailway-edge
      - traefik.http.routers.mailway-webmail.rule=Host(`${WEBMAIL_HOSTNAME:?Define WEBMAIL_HOSTNAME en deploy/.env}`)
      - traefik.http.routers.mailway-webmail.entrypoints=web
      - traefik.http.middlewares.mailway-webmail-https.redirectscheme.scheme=https
      - traefik.http.middlewares.mailway-webmail-https.redirectscheme.permanent=true
      - traefik.http.routers.mailway-webmail.middlewares=mailway-webmail-https
      - traefik.http.routers.mailway-webmail-secure.rule=Host(`${WEBMAIL_HOSTNAME}`)
      - traefik.http.routers.mailway-webmail-secure.entrypoints=websecure
      - traefik.http.routers.mailway-webmail-secure.tls.certresolver=le
      - traefik.http.services.mailway-webmail.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # OPCIONAL (perfil `proxy`): Traefik propio con Let's Encrypt en 80/443.
  # --------------------------------------------------------------------------
  mailway-proxy:
    image: traefik:v3.7.14
    container_name: mailway-proxy
    restart: unless-stopped
    profiles: ['proxy']
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mailway-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Marca blanca: el panel publica las rutas de los dominios propios de
      # los clientes (solo los que ya apuntan aquí).
      - --providers.http.endpoint=http://mailway-panel:4100/api/traefik/config
      - --providers.http.pollInterval=15s
      - --providers.http.headers.X-Mailway-Token=${MAILWAY_TRAEFIK_TOKEN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mailway-letsencrypt:/letsencrypt
    networks:
      - mailway-edge

  # --------------------------------------------------------------------------
  # Perfil `tls`: extractor del certificado de MAIL_HOSTNAME que obtuvo el
  # Traefik del perfil `proxy`, para IMAP y SMTP. Con Stalwart 0.16 es la
  # única vía; con la 0.15, solo si no se usa el ACME del propio motor
  # (Ajustes → Servidor de correo). Escribe en el volumen del motor
  # únicamente ese par, lo recarga, comprueba 993 y 465 y vuelve al anterior
  # si falla. Detalle en docker-compose.mail.yml y en la sección 5.2 de
  # docs/DESPLIEGUE-SKYWAY.md.
  # --------------------------------------------------------------------------
  certs-dumper:
    image: python:3.14.8-alpine
    container_name: mailway-certs-dumper
    restart: unless-stopped
    profiles: ['tls']
    command: ['python', '/app/extractor.py']
    init: true
    read_only: true
    cap_drop: [ALL]
    # Para entregar la clave privada al usuario 2000 de Stalwart 0.16 (ver
    # docker-compose.mail.yml).
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:size=8m
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?Define MAIL_HOSTNAME en deploy/.env}
      STALWART_URL: http://mailway-mail:8080
      STALWART_ADMIN_USER: admin
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?Define STALWART_ADMIN_PASSWORD en deploy/.env}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    extra_hosts:
      - mailway-mail:${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
    volumes:
      - mailway-letsencrypt:/traefik:ro
      - mailway-mail-certs:/output
      - ./tls:/app:ro
    networks:
      - mailway-internal
    depends_on:
      mailway-mail:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '/app/extractor.py', 'salud']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --------------------------------------------------------------------------
  # Perfil `bulwark`: Bulwark y su pasarela, como en docker-compose.mail.yml
  # (con mailway-edge en lugar de skyway-edge). Lo activa y desactiva
  # «sudo mailway bulwark on|off»; desactivarlo conserva volúmenes y secretos.
  # --------------------------------------------------------------------------
  mailway-bulwark:
    image: ghcr.io/bulwarkmail/webmail:1.13.0@sha256:cc85f569396b6eb1d3f8cf41311b7512cf6b943fa28a8844a27edaeb2daae1ed
    container_name: mailway-bulwark
    restart: unless-stopped
    profiles: ['bulwark']
    env_file: ./bulwark/bulwark.env
    environment:
      JMAP_SERVER_URL: https://${MAIL_HOSTNAME}
      SESSION_SECRET: ${BULWARK_SESSION_SECRET:-}
      ADMIN_PASSWORD: ${BULWARK_ADMIN_PASSWORD:-}
      APP_NAME: ${MAILWAY_BRAND:-Webmail}
      LOGIN_WEBSITE_URL: ${MAILWAY_PANEL_URL:-https://${PANEL_HOSTNAME}}/mi-buzon
    extra_hosts:
      - ${MAIL_HOSTNAME}:${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - mailway-bulwark-ajustes:/app/data/settings
      - mailway-bulwark-admin:/app/data/admin
      - mailway-bulwark-estado:/app/data/admin-state
      - ./bulwark/marca/mailway:/app/public/branding/mailway:ro
    networks:
      - mailway-internal   # el motor, desde la subred exenta
      - mailway-edge       # la pasarela y el panel (API de administración)
    labels:
      - mailway.bulwark-marca=${MAILWAY_BULWARK_MARCA_HASH:-}
    depends_on:
      mailway-mail:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mailway-bulwark-gw:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: mailway-bulwark-gw
    restart: unless-stopped
    profiles: ['bulwark']
    command: ['nginx', '-c', '/etc/nginx/mailway/nginx.conf', '-g', 'daemon off;']
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./bulwark/nginx:/etc/nginx/mailway:ro
    networks:
      - mailway-edge
    labels:
      - mailway.bulwark-gw-config=${MAILWAY_BULWARK_GW_HASH:-}
    depends_on:
      - mailway-bulwark
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/salud']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Subred fija y poco común: el motor exime de su bloqueo automático solo
  # este rango (webmail y panel). La red del proxy (mailway-edge) no se
  # exime: por ella entra el tráfico de Internet. Ver docker-compose.mail.yml.
  mailway-internal:
    name: mailway-internal
    ipam:
      config:
        - subnet: ${MAILWAY_INTERNAL_SUBNET:-10.203.53.0/24}
  mailway-edge:
    name: mailway-edge

volumes:
  mailway-panel-data:
    name: ${MAILWAY_PANEL_VOLUME:-mailway-panel-data}
  # Stalwart 0.15 (se conserva intacto tras migrar a la 0.16) y Stalwart 0.16
  # (configuración y datos). Ver docker-compose.mail.yml.
  mailway-mail-data:
    name: ${MAILWAY_MAIL_VOLUME:-mailway-mail-data}
  mailway-stalwart-etc:
    name: ${MAILWAY_STALWART_ETC_VOLUME:-mailway-stalwart-etc}
  mailway-stalwart-data:
    name: ${MAILWAY_STALWART_DATA_VOLUME:-mailway-stalwart-data}
  mailway-webmail-db:
    name: ${MAILWAY_WEBMAIL_DB_VOLUME:-mailway-webmail-db}
  mailway-mail-certs:
    name: mailway-mail-certs
  mailway-letsencrypt:
    name: mailway-letsencrypt
  # Bulwark (perfil `bulwark`); ver docker-compose.mail.yml.
  mailway-bulwark-ajustes:
    name: mailway-bulwark-ajustes
  mailway-bulwark-admin:
    name: mailway-bulwark-admin
  mailway-bulwark-estado:
    name: mailway-bulwark-estado
