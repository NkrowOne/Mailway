# Marca blanca: dominios propios de tus clientes con certificado automático.
#
# QUÉ HACE
#   Hace que el Traefik de Skyway le pregunte a Mailway, cada 15 segundos, qué
#   dominios de clientes debe servir. Cuando un cliente añade
#   `webmail.suempresa.com` y su DNS ya apunta aquí, Traefik lo enruta y pide
#   su certificado a Let's Encrypt sin que tengas que tocar nada.
#
# CÓMO SE INSTALA (una sola vez)
#   1. Copia este fichero a la carpeta de Skyway con el nombre exacto
#      `docker-compose.override.yml`:
#
#        cp deploy/skyway-traefik-override.yml /ruta/a/Skyway/docker-compose.override.yml
#
#   2. Sustituye PON_AQUI_TU_TOKEN por el token que aparece en
#      Mailway → Ajustes → Marca blanca (el panel te da este bloque ya relleno).
#
#   3. Aplícalo:
#        cd /ruta/a/Skyway && docker compose up -d
#
# POR QUÉ UN FICHERO APARTE Y NO EDITAR EL COMPOSE DE SKYWAY
#   Docker Compose lee `docker-compose.override.yml` automáticamente y lo
#   fusiona con el principal. Al ser un fichero que Skyway no versiona, tus
#   cambios sobreviven a `git pull` y no ensucian su repositorio.
#
# AVISO IMPORTANTE SOBRE `command`
#   Compose REEMPLAZA `command` entero, no lo fusiona. Por eso hay que repetir
#   aquí los flags que Skyway ya traía: si se omite alguno, Traefik arrancaría
#   sin él. Los de abajo son los de Skyway v0.24; si algún día actualizas
#   Skyway y cambia su configuración de Traefik, compara y actualiza esta lista.

services:
  traefik:
    command:
      # ---- Flags originales de Skyway (mantener sincronizados) ----
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skyway-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-noreply@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # ---- Añadido por Mailway ----
      # `mailway-panel` es el nombre del contenedor del panel. Si lo despliegas
      # con Skyway, su nombre lo genera Skyway: compruébalo con `docker ps` y
      # ajústalo aquí (el panel te muestra la línea exacta en Ajustes).
      - --providers.http.endpoint=http://mailway-panel:4100/api/traefik/config
      - --providers.http.pollInterval=15s
      - --providers.http.headers.X-Mailway-Token=PON_AQUI_TU_TOKEN
