# ============================================================================
# Stack de correo de Mailway — para un servidor que YA ejecuta Skyway
# ----------------------------------------------------------------------------
# Levanta el motor de correo (Stalwart) y el webmail (Roundcube). El panel de
# Mailway NO va aquí: lo despliega Skyway desde GitHub (ver instalar.sh).
#
# Forma recomendada (lo prepara todo y es idempotente):
#   sudo bash deploy/instalar.sh
#
# A mano:
#   cp deploy/.env.example deploy/.env      # y rellena las variables
#   docker compose -f deploy/docker-compose.mail.yml up -d
#
# Redes:
#   - skyway-edge (de Skyway): Traefik da HTTPS al webmail y a la web del
#     motor, y el panel (desplegado por Skyway) llega al motor por
#     http://mailway-mail:8080 y al SMTP interno por mailway-mail:587 (con
#     verificación del certificado contra MAIL_HOSTNAME). En esta red están
#     también las demás aplicaciones de Skyway con dominio: alcanzan los
#     puertos internos del motor, pero sin exención del bloqueo automático y
#     con la API de gestión protegida por la contraseña del administrador.
#   - mailway-internal (propia, subred FIJA): el webmail habla con el motor
#     por dentro (IMAP 993, SMTP 465, ManageSieve 4190). Ver la explicación
#     de la subred al final del fichero.
#
# Los puertos de correo (25, 465, 587, 993, 4190) se publican directamente en
# el host: no pasan por Traefik y no chocan con Skyway (80/443/4000).
#
# Motor (MAILWAY_MOTOR en deploy/.env): lo propio de cada versión de Stalwart
# (imagen, volúmenes, credenciales, rutas de Traefik y comprobación de salud)
# vive en motor/<motor>/compose.yml, que el servicio mailway-mail incorpora
# con «extends»:
#   - stalwart-0.16: el de las instalaciones nuevas (gestión por JMAP).
#   - stalwart-0.15: el de las anteriores (API REST), y el que se usa si
#     deploy/.env no dice nada. Deja de recibir parches de seguridad el
#     1-12-2026; se pasa a la 0.16 con «sudo mailway migrar-motor», nunca
#     con un «pull» ni con «mailway update».
#
# Certificado de IMAP/SMTP:
#   - Con Stalwart 0.16, siempre el que Traefik obtiene para MAIL_HOSTNAME,
#     que lleva al motor el extractor (servicio `certs-dumper`, perfil
#     `tls`): solo ese par, validado, y lo renueva solo.
#   - Con Stalwart 0.15 hay además otra vía, la que se prefería: el ACME del
#     propio motor con reto DNS-01 en Cloudflare (instalador o panel, en
#     Ajustes → Servidor de correo). Al migrar a la 0.16 pasa al extractor.
#
# Diagnóstico de la pila (no cambia nada) y prueba de acceso a un buzón:
#   sudo bash deploy/instalar.sh --comprobar
#   sudo bash deploy/instalar.sh --probar-acceso
#
# Todas las imágenes llevan su versión exacta (p. ej. 1.7.4-apache, no
# 1.7.x): una versión nueva solo llega como un PR de Dependabot que pasa la CI
# y la pila real (stack.yml) antes de fusionarse, y «mailway update» la aplica
# con comprobación y vuelta atrás. Así un «pull» nunca trae nada sin probar.
# ============================================================================

# Nombre de proyecto fijo: los contenedores, redes y volúmenes no dependen del
# nombre de la carpeta desde la que se ejecute Compose.
name: mailway

services:
  mailway-mail:
    # Imagen, credenciales, volúmenes, rutas de Traefik y comprobación de
    # salud: las del motor elegido (ver la cabecera).
    extends:
      file: motor/${MAILWAY_MOTOR:-stalwart-0.15}/compose.yml
      service: mailway-mail
    container_name: mailway-mail
    # Sin esto Stalwart se identifica con el ID del contenedor: sus registros
    # DNS propuestos (MX, SRV, autoconfig) apuntarían a un nombre inexistente.
    hostname: ${MAIL_HOSTNAME:?Define MAIL_HOSTNAME en deploy/.env}
    restart: unless-stopped
    ports:
      - '25:25'       # SMTP entre servidores (recepción y entrega)
      - '465:465'     # SMTP de envío con TLS implícito (programas de correo)
      - '587:587'     # SMTP de envío con STARTTLS (programas de correo y API)
      - '993:993'     # IMAP con TLS implícito (programas de correo)
      - '4190:4190'   # ManageSieve (filtros y respuesta automática)
    networks:
      mailway-internal:
        # IP fija: el webmail la usa para llegar al motor SIEMPRE por la red
        # interna (ver extra_hosts del webmail).
        ipv4_address: ${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
      skyway-edge: {}
    labels:
      # Web del motor por HTTPS en el nombre del servidor de correo (las
      # rutas, en el fichero del motor). Además hace que Traefik obtenga el
      # certificado de MAIL_HOSTNAME, que el extractor lleva a IMAP/SMTP.
      - traefik.enable=true
      - traefik.docker.network=skyway-edge

  mailway-webmail:
    image: roundcube/roundcubemail:1.7.4-apache
    container_name: mailway-webmail
    restart: unless-stopped
    depends_on:
      mailway-mail:
        condition: service_healthy
    environment:
      # Por la red interna y con TLS: funciona desde el primer minuto, aunque
      # el certificado público aún no exista (la verificación se desactiva
      # solo para este host interno, en roundcube/mailway.php).
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailway-mail
      ROUNDCUBEMAIL_DEFAULT_PORT: '993'
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mailway-mail
      ROUNDCUBEMAIL_SMTP_PORT: '465'
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,password,markasjunk,newmail_notifier,attachment_reminder,emoticons,vcard_attachments,hide_blockquote,identity_select,mailway_perfil,mailway_sesion,mailway_theme
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      # Clave fija: con la que genera la imagen en cada recreación, las
      # sesiones abiertas y las contraseñas guardadas dejarían de valer.
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:?Define ROUNDCUBE_DES_KEY (24 caracteres) en deploy/.env}
      # Leídas por roundcube/mailway.php:
      MAILWAY_BRAND: ${MAILWAY_BRAND:-Webmail}
      MAILWAY_PANEL_URL: ${MAILWAY_PANEL_URL:-}
      MAILWAY_PANEL_INTERNAL_URL: ${MAILWAY_PANEL_INTERNAL_URL:-http://skyway-mailway-panel:4100}
      MAILWAY_WEBMAIL_TOKEN: ${MAILWAY_WEBMAIL_TOKEN:-}
    extra_hosts:
      # «mailway-mail» también existe en skyway-edge, y el DNS de Docker
      # podría devolver esa IP. Fijarlo aquí garantiza que el webmail entra
      # al motor desde la subred exenta del bloqueo automático.
      - mailway-mail:${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
    volumes:
      - mailway-webmail-db:/var/roundcube/db
      # El entrypoint de la imagen incluye todo /var/roundcube/config/*.php.
      - ./roundcube/mailway.php:/var/roundcube/config/mailway.php:ro
      # Capa visual de Mailway sobre Elastic (solo aspecto; ver roundcube/README.md).
      - ./roundcube/mailway_theme:/var/www/html/plugins/mailway_theme:ro
      # Nombre visible y foto del buzón desde el panel (ver roundcube/README.md).
      - ./roundcube/mailway_perfil:/var/www/html/plugins/mailway_perfil:ro
      # Cierre de sesión con aviso si la contraseña cambia por fuera (ver roundcube/README.md).
      - ./roundcube/mailway_sesion:/var/www/html/plugins/mailway_sesion:ro
      # Diagnóstico de instalar.sh --comprobar y --probar-acceso (solo línea
      # de órdenes). Fuera de la raíz web y de /var/roundcube/config, cuyos
      # .php se cargarían como configuración.
      - ./roundcube/diagnostico:/opt/mailway:ro
    networks:
      - mailway-internal
      - skyway-edge
    labels:
      - traefik.enable=true
      # Huella de roundcube/mailway.php (la pone el instalador): se monta como
      # fichero suelto y, tras «git pull», el contenedor seguiría leyendo la
      # versión anterior. Si cambia, Compose recrea el webmail.
      - mailway.roundcube-config=${MAILWAY_ROUNDCUBE_CONFIG_HASH:-}
      - traefik.docker.network=skyway-edge
      - traefik.http.routers.mailway-webmail.rule=Host(`${WEBMAIL_HOSTNAME:?Define WEBMAIL_HOSTNAME en deploy/.env}`)
      - traefik.http.routers.mailway-webmail.entrypoints=web
      - traefik.http.middlewares.mailway-webmail-https.redirectscheme.scheme=https
      - traefik.http.middlewares.mailway-webmail-https.redirectscheme.permanent=true
      - traefik.http.routers.mailway-webmail.middlewares=mailway-webmail-https
      - traefik.http.routers.mailway-webmail-secure.rule=Host(`${WEBMAIL_HOSTNAME}`)
      - traefik.http.routers.mailway-webmail-secure.entrypoints=websecure
      - traefik.http.routers.mailway-webmail-secure.tls.certresolver=le
      - traefik.http.services.mailway-webmail.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      # El primer arranque copia Roundcube y crea su base de datos.
      start_period: 90s

  # --------------------------------------------------------------------------
  # Perfil `tls`: extractor del certificado de MAIL_HOSTNAME para IMAP y SMTP
  # (deploy/tls/extractor.py). Con Stalwart 0.16 es la única vía y el
  # instalador lo activa siempre; con la 0.15, solo si no se usa el ACME del
  # propio motor (si el motor ya emite su certificado, no hace nada).
  #   docker compose --env-file deploy/.env -f deploy/docker-compose.mail.yml --profile tls up -d certs-dumper
  #
  # Lee el acme.json de Traefik en solo lectura, elige el certificado exacto
  # o comodín de MAIL_HOSTNAME que caduca más tarde, lo valida (vigencia,
  # nombre y par clave/certificado) y escribe en el volumen del motor
  # ÚNICAMENTE ese par: /opt/stalwart/certs/<MAIL_HOSTNAME>/cert.pem y
  # key.pem (la ruta del volumen en el motor, con las dos versiones). Con la
  # 0.15 son las rutas de certificate.mailway; con la 0.16, las del
  # Certificate de tipo File que crea el propio extractor. Si cambia, recarga
  # los certificados del motor, comprueba el que sirve en 993 y 465 y, si no
  # es el nuevo, vuelve al anterior. Sustituye al volcado de
  # traefik-certs-dumper, que copiaba al motor las claves privadas de TODOS
  # los dominios de Traefik (también las de las demás webs de Skyway): al
  # arrancar retira esas copias del volumen.
  #
  # Necesita la contraseña VIGENTE del administrador del motor para recargar.
  # Si el motor la rechaza, no reintenta hasta pasada una hora: cada intento
  # fallido cuenta para su bloqueo automático. Va solo en mailway-internal,
  # la red exenta de ese bloqueo.
  # Estado: docker exec mailway-certs-dumper python /app/extractor.py estado
  # --------------------------------------------------------------------------
  certs-dumper:
    image: python:3.13.16-alpine
    container_name: mailway-certs-dumper
    restart: unless-stopped
    profiles: ['tls']
    command: ['python', '/app/extractor.py']
    # tini como PID 1: reenvía la señal de parada al proceso.
    init: true
    read_only: true
    cap_drop: [ALL]
    # La única capacidad: Stalwart 0.16 corre como el usuario 2000 y no podría
    # leer una clave privada de root con permisos 600; el extractor se la
    # entrega a ese usuario (chown) al escribirla.
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:size=8m
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?Define MAIL_HOSTNAME en deploy/.env}
      STALWART_URL: http://mailway-mail:8080
      STALWART_ADMIN_USER: admin
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?Define STALWART_ADMIN_PASSWORD en deploy/.env}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    extra_hosts:
      # Siempre por la subred interna, la exenta del bloqueo automático.
      - mailway-mail:${MAILWAY_MAIL_INTERNAL_IP:-10.203.53.10}
    volumes:
      # Traefik guarda acme.json con permisos 600: el proceso corre como root
      # (sin más capacidad que CHOWN) para leerlo, y siempre en solo lectura.
      - traefik-letsencrypt:/traefik:ro
      - mailway-mail-certs:/output
      - ./tls:/app:ro
    networks:
      - mailway-internal
    depends_on:
      mailway-mail:
        condition: service_healthy
    healthcheck:
      # Sano = el motor sirve en 993 y 465 el certificado vigente (o usa su
      # propio ACME y no hay nada que hacer).
      test: ['CMD', 'python', '/app/extractor.py', 'salud']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  # Subred fija y poco común (10.203.53.0/24) por dos motivos:
  #   1. El motor exime de su bloqueo automático SOLO este rango
  #      (server.allowed-ip.10.203.53.0/24, lo aplica el panel o el
  #      instalador). Los fallos de contraseña de los usuarios del webmail
  #      llegan todos desde la IP del webmail: sin la exención, a las 100
  #      fallidas del día el motor bloquearía para siempre al webmail entero.
  #      La red de Traefik NO se exime: por ella entra el tráfico de Internet.
  #   2. Un rango poco habitual no choca con las redes de Docker por defecto
  #      (172.17–31.x, 192.168.x) ni con las VPN y redes privadas típicas
  #      (10.0.x, 10.8.x).
  # Si la cambias, cambia también MAILWAY_MAIL_INTERNAL_IP y la variable
  # MAILWAY_ENGINE_TRUSTED_NETWORK del panel.
  mailway-internal:
    name: mailway-internal
    ipam:
      config:
        - subnet: ${MAILWAY_INTERNAL_SUBNET:-10.203.53.0/24}
  skyway-edge:
    external: true
    name: skyway-edge

volumes:
  # Stalwart 0.15: todo el correo y la configuración del motor. Con una
  # instalación anterior a la 1.0 (proyecto «deploy»), el instalador reutiliza
  # el volumen antiguo fijando MAILWAY_MAIL_VOLUME=deploy_mailway-mail-data en
  # deploy/.env. Tras migrar a la 0.16 se conserva intacto (es la vuelta
  # atrás) hasta que se retira con «mailway retirar-motor-anterior».
  mailway-mail-data:
    name: ${MAILWAY_MAIL_VOLUME:-mailway-mail-data}
  # Stalwart 0.16: configuración (config.json) y datos (correo y ajustes).
  # La migración crea unos con fecha y los fija aquí en deploy/.env; Compose
  # solo crea los que usa el motor elegido.
  mailway-stalwart-etc:
    name: ${MAILWAY_STALWART_ETC_VOLUME:-mailway-stalwart-etc}
  mailway-stalwart-data:
    name: ${MAILWAY_STALWART_DATA_VOLUME:-mailway-stalwart-data}
  mailway-webmail-db:
    name: ${MAILWAY_WEBMAIL_DB_VOLUME:-mailway-webmail-db}
  # Certificado de MAIL_HOSTNAME para el motor (perfil `tls`). Lo escribe el
  # extractor y lo lee el motor en solo lectura.
  mailway-mail-certs:
    name: mailway-mail-certs
  # Volumen del acme.json del Traefik de Skyway. Su nombre depende de la
  # carpeta de Skyway (<carpeta>_traefik-letsencrypt); el instalador lo
  # detecta. A mano: docker volume ls | grep letsencrypt
  traefik-letsencrypt:
    external: true
    name: ${TRAEFIK_ACME_VOLUME:-skyway_traefik-letsencrypt}
