# Pasarela HTTP del motor de correo (nginx), con Stalwart 0.15 y 0.16.
# Servicio mailway-mail-gw de los compose; detalle en docs/SEGURIDAD.md
# (sección 7) y en la sección 4.4 de docs/DESPLIEGUE-SKYWAY.md.
#
#   Internet → (Cloudflare) → Traefik → esta pasarela :8080 → motor (mailway-mail:8080)
#
# Por qué existe: el motor, con useXForwarded (necesario detrás de Traefik),
# toma la IP del cliente de la PRIMERA dirección de X-Forwarded-For, y esa la
# escribe quien hace la petición en cuanto Traefik conserva la cabecera que
# le llega. Lo hace si confía en los rangos de Cloudflare
# (forwardedHeaders.trustedIPs, para ver la IP real de los visitantes): una
# petición enviada a través de Cloudflare con «X-Forwarded-For: <IP de la red
# interna>» se haría pasar por la red exenta del bloqueo automático y podría
# probar contraseñas sin límite contra https://MAIL_HOSTNAME. Aquí se calcula
# la IP real como en la pasarela de Bulwark (deploy/bulwark/nginx/nginx.conf:
# el último salto que no es de un proxy de confianza) y el motor recibe SOLO
# esa, sin la cabecera Forwarded, que lee antes que X-Forwarded-For.
#
# Todo lo demás pasa tal cual, como hacía Traefik: rutas (sin normalizar),
# métodos de DAV, cuerpos (adjuntos de JMAP) sin guardarlos, respuestas sin
# búfer (el push de JMAP por EventSource), WebSocket y conexiones largas. Qué
# rutas del nombre del servidor se publican lo decide Traefik con las
# etiquetas del motor (deploy/motor/<motor>/compose.yml).
#
# Se monta la carpeta deploy/motor/pasarela en /etc/nginx/mailway (solo
# lectura) y se arranca con «nginx -c /etc/nginx/mailway/nginx.conf». Los
# temporales van a /tmp (tmpfs): el contenedor va con la raíz en solo lectura.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    server_tokens off;

    client_body_temp_path /tmp/nginx-cuerpos;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # DNS de Docker. El nombre del motor se resuelve en cada consulta: si su
    # contenedor se recrea con otra IP, la pasarela lo sigue encontrando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # La pasarela solo está en la red de Traefik: llega al motor por ella, nunca
    # por la red interna (la exenta del bloqueo automático).
    upstream motor {
        zone motor 64k;
        server mailway-mail:8080 resolve;
        keepalive 32;
    }

    # ----------------------------------------------------------- IP real --
    # El mismo cálculo que la pasarela de Bulwark (y la misma tabla en la
    # documentación): si se cambia uno, se cambia el otro. La prueba
    # deploy/prueba-pasarela.sh lo comprueba caso por caso.

    # ¿Quién conecta con la pasarela? Traefik, por una red de Docker: sus
    # cabeceras se creen. Una conexión desde fuera de esas redes no las trae
    # de nadie de confianza y se toma su propia IP.
    geo $mw_par_confiable {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1            1;
        fc00::/7       1;
    }

    # Último salto de X-Forwarded-For: la IP que conectó con Traefik. Traefik
    # lo escribe siempre, así que el visitante no puede falsearlo.
    map $http_x_forwarded_for $mw_ultimo_salto {
        default "";
        "~(?:^|,)[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*$" $ip;
    }

    # Salto anterior al último: si el último es un nodo de Cloudflare, es la
    # IP del visitante tal como la vio Cloudflare (que añade la suya detrás de
    # lo que traiga la petición). Solo existe si Traefik conserva el
    # X-Forwarded-For de Cloudflare (trustedIPs con sus rangos). Lo de su
    # izquierda lo escribe quien hace la petición: nunca se mira.
    map $http_x_forwarded_for $mw_salto_anterior {
        default "";
        "~(?:^|,)[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*,[ \t]*[0-9A-Fa-f.:]+[ \t]*$" $ip;
    }

    # El visitante según Cloudflare. Solo vale si el último salto es de
    # Cloudflare: cualquiera puede conectar con el servidor sin pasar por él
    # y escribir esta cabecera.
    map $http_cf_connecting_ip $mw_visitante_cloudflare {
        default "";
        "~^[ \t]*(?<ip>[0-9A-Fa-f.:]+)[ \t]*$" $ip;
    }

    # Rangos de Cloudflare: cloudflare.conf, GENERADO a partir de
    # deploy/bulwark/cloudflare/rangos.txt (fuente única) con
    # deploy/bulwark/cloudflare/generar.sh.
    geo $mw_ultimo_salto $mw_ultimo_es_cloudflare {
        default 0;
        include /etc/nginx/mailway/cloudflare.conf;
    }

    # Clave: «par de confianza:último es Cloudflare|salto anterior|CF-Connecting-IP|último».
    # Las expresiones se prueban en orden; sin coincidencia, la IP que conecta.
    map "$mw_par_confiable:$mw_ultimo_es_cloudflare|$mw_salto_anterior|$mw_visitante_cloudflare|$mw_ultimo_salto" $mw_ip_real {
        default                              $remote_addr;
        # No llega de Traefik: su propia IP, sin creer ninguna cabecera.
        "~^0:"                               $remote_addr;
        # Último salto ajeno a Cloudflare: ese salto.
        "~^1:0\|[^|]*\|[^|]*\|(?<u>[^|]+)$"  $u;
        # Por Cloudflare, con el salto anterior: el visitante según Cloudflare.
        "~^1:1\|(?<a>[^|]+)\|"               $a;
        # Por Cloudflare, sin salto anterior (Traefik reescribe la cabecera).
        "~^1:1\|\|(?<c>[^|]+)\|"             $c;
        # Por Cloudflare sin datos del visitante: el nodo de Cloudflare. No se
        # inventa nada, aunque agrupe a muchos visitantes bajo una IP.
        "~^1:1\|\|\|(?<u>[^|]+)$"            $u;
    }

    map "$mw_par_confiable:$http_x_forwarded_proto" $mw_proto {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # WebSocket (JMAP sobre WebSocket): se pasa la petición de cambio de
    # protocolo; sin ella, conexión persistente con el motor. «Upgrade» con
    # mayúscula: Stalwart 0.15 no reconoce «upgrade» (responde 400 «WebSocket
    # upgrade failed»; comprobado en deploy/prueba-pasarela.sh).
    map $http_upgrade $mw_conexion {
        default Upgrade;
        ""      "";
    }

    # ---------------------------------------------------------- Registro --

    # Una línea JSON por cada respuesta de error (4xx y 5xx: accesos
    # rechazados, bloqueos del motor, motor caído), con la IP real. Las que
    # salen bien no se anotan: los programas de calendario y contactos
    # consultan cada pocos minutos. Solo la ruta ($uri, sin la cadena de
    # consulta, que en la autoconfiguración lleva la dirección del buzón) y
    # nunca cabeceras (Authorization, Cookie).
    map $status $mw_registrar {
        "~^[123]" 0;
        default   1;
    }
    log_format mailway escape=json
        '{"hora":"$time_iso8601","ip":"$mw_ip_real","par":"$remote_addr",'
        '"host":"$host","metodo":"$request_method","ruta":"$uri",'
        '"estado":$status,"bytes":$body_bytes_sent,"duracion":$request_time}';

    server {
        listen 8080 default_server;
        server_name _;

        access_log /dev/stdout mailway if=$mw_registrar;

        # Sin tope propio: el del motor (tamaño de subida de JMAP, DAV). El
        # cuerpo pasa al motor según llega, sin guardarlo en /tmp.
        client_max_body_size 0;
        proxy_request_buffering off;
        large_client_header_buffers 8 32k;
        client_header_timeout 60s;
        client_body_timeout 300s;
        send_timeout 300s;
        keepalive_timeout 75s;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection $mw_conexion;
        proxy_set_header Upgrade $http_upgrade;
        # La IP real, sola. Host, X-Forwarded-Host y X-Forwarded-Port llegan
        # como los escribe Traefik.
        proxy_set_header X-Forwarded-For $mw_ip_real;
        proxy_set_header X-Real-IP $mw_ip_real;
        proxy_set_header X-Forwarded-Proto $mw_proto;
        # Nada más que diga quién es el visitante. Un valor vacío retira la
        # cabecera; Forwarded la leería el motor antes que X-Forwarded-For.
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_redirect off;
        # Respuestas sin búfer, como Traefik: el push de JMAP (EventSource) y
        # las descargas grandes llegan según salen del motor.
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # Conexiones largas: EventSource y WebSocket de JMAP, informes de DAV.
        proxy_read_timeout 3600s;

        location / {
            proxy_pass http://motor;
        }
    }

    # Salud de la propia pasarela (healthcheck del contenedor), solo dentro
    # del contenedor.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /salud {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
