# Actualizaciones de dependencias con Dependabot.
#
# Cada lunes de madrugada abre PR con lo nuevo de npm, de las imágenes de
# Docker (Dockerfile del panel y compose de deploy/) y de las acciones de
# GitHub. Los PARCHES (x.y.Z) de cada ecosistema van juntos en un grupo
# «parches-…», y los de seguridad de npm en «seguridad-npm»:
# .github/workflows/parches-automaticos.yml los fusiona solo cuando todas las
# comprobaciones de su commit han terminado bien, incluida la pila de correo
# con contenedores reales (stack.yml) si tocan los compose. Lo demás (versiones
# menores, y las de seguridad que no son un parche) llega en PR sueltos que
# revisa una persona.
#
# En cada servidor, «mailway update --auto» (sudo mailway auto-update on) aplica
# lo fusionado cada noche, lo comprueba y vuelve a la versión anterior si algo
# falla (docs/DESPLIEGUE-SKYWAY.md, sección 8.1).
version: 2
updates:
  # Un solo package-lock.json en la raíz para server/ y web/ (workspaces).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      # React y sus tipos llegan juntos: por separado (react-dom 19 con react
      # 18, #55) los tipos se mezclan y nada compila. Los parches siguen en
      # «parches-npm», que va después; el primer grupo que encaja se queda la
      # actualización.
      react:
        applies-to: version-updates
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, major]
      parches-npm:
        applies-to: version-updates
        update-types: [patch]
      seguridad-npm:
        applies-to: security-updates
        update-types: [patch]
    # CONGELADAS: no se actualizan salvo por algo crítico (un fallo de
    # seguridad grave que solo arregla la versión nueva, o que la nuestra deje
    # de recibir parches). Funcionan bien como están y subirlas es una
    # migración con riesgo que no aporta nada al servicio. Si llega ese caso,
    # se hace en un PR propio, probado en el navegador, nunca con el de
    # Dependabot. Las menores y los parches de estas sí siguen llegando.
    # - TypeScript 6/7: el lint (typescript-eslint) aún no lo admite y los
    #   editores pierden el autocompletado; el JavaScript que sale es el mismo.
    # - React 19 (react, react-dom y sus tipos): cambia refs, StrictMode y
    #   Suspense y engorda el panel; hay que revisarlo entero en el navegador.
    # - Tailwind 4: la configuración pasa a CSS y cambian clases. Los avisos
    #   de seguridad de Tailwind 3 (braces, postcss-selector-parser) solo
    #   afectan a la compilación, que lee nuestro propio CSS.
    #
    # Saltos que piden una migración propia, no un PR de Dependabot:
    # - zod 4 retira required_error, invalid_type_error y errorMap y cambia
    #   sus textos por defecto, que llegan a las respuestas de la API (también
    #   /v1/send). Se migrará por módulos con «zod/v4», que ya trae la 3.25.
    # - vite 8 compila con Rolldown y necesita @vitejs/plugin-react 6: se sube
    #   junto con el plugin, a mano. El plugin 6 solo funciona con vite 8.
    # - @types/node sigue a la versión de Node con la que corre el panel (22):
    #   los tipos de una versión posterior dejan usar lo que Node 22 no tiene.
    ignore:
      # Ninguna versión mayor llega por Dependabot (decisión del 12 de
      # octubre: lo que funciona no se toca si no hace falta). Se sube a mano,
      # en un PR propio, solo por algo crítico. Las de abajo explican por qué
      # algunas concretas no se suben.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        versions: ['>=8.0.0']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6.0.0']
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
      # Congeladas (ver arriba).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  # Imagen base del panel (Dockerfile): Node con versión exacta.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-docker:
        update-types: [patch]
    ignore:
      # Un salto de versión mayor (Node 22 → 24) siempre a mano.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Webmail, extractor, Traefik propio, las pasarelas (nginx) y Bulwark
  # (deploy/docker-compose.*.yml).
  #
  # Bulwark solo recibe parches (1.13.x), en un PR propio que no se fusiona
  # solo (el grupo no es «parches-…»): publica versiones cada semana y su
  # pasarela solo cierra las rutas que conoce, así que cada versión pasa por
  # la lista «Actualizar Bulwark» de deploy/bulwark/README.md (CHANGELOG,
  # rutas nuevas, README, prueba.sh y su prueba del servidor). La CI ensaya
  # la imagen nueva (deploy/bulwark/prueba.sh y la pila con Bulwark). Una
  # versión menor (1.14) se sube a mano, con la misma lista.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    # Dependabot nombra las imágenes de ghcr.io sin el registro
    # («bulwarkmail/webmail»): con solo el nombre completo, ni el grupo ni la
    # exclusión de «parches-compose» ni el ignore la reconocían, y llegó la
    # 1.14 en un PR suelto. Van las dos formas.
    groups:
      bulwark:
        patterns: ['bulwarkmail/*', 'ghcr.io/bulwarkmail/*']
        update-types: [patch]
      parches-compose:
        exclude-patterns: ['bulwarkmail/*', 'ghcr.io/bulwarkmail/*']
        update-types: [patch]
    ignore:
      - dependency-name: 'bulwarkmail/webmail'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'ghcr.io/bulwarkmail/webmail'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Cada motor en su carpeta (deploy/motor/stalwart-0.15 y stalwart-0.16, el
  # de las instalaciones nuevas, con el CLI de Stalwart que usa la
  # migración): así cada uno solo ve su versión y sube solo dentro de su
  # serie. Los parches (0.15.x, 0.16.x) se fusionan solos si pasan las
  # pruebas con los motores reales (contrato del panel, pila y migración, en
  # stack.yml). Un cambio de serie (0.15 → 0.16, o a la 0.17) cambia la
  # gestión o los datos del motor y nunca llega por aquí: de la 0.15 a la
  # 0.16 se pasa con «mailway migrar-motor».
  - package-ecosystem: docker-compose
    directory: /deploy/motor/stalwart-0.16
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-motor-016:
        update-types: [patch]
    ignore:
      - dependency-name: stalwartlabs/stalwart
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /deploy/motor/stalwart-0.15
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-motor-015:
        update-types: [patch]
    ignore:
      - dependency-name: stalwartlabs/stalwart
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-actions:
        update-types: [patch]
