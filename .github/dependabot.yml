# Actualizaciones de dependencias con Dependabot.
#
# Cada lunes de madrugada abre PR con lo nuevo de npm, de las imágenes de
# Docker (Dockerfile del panel y compose de deploy/) y de las acciones de
# GitHub. Los PARCHES (x.y.Z) de cada ecosistema van juntos en un grupo
# «parches-…», y los de seguridad de npm en «seguridad-npm»:
# .github/workflows/parches-automaticos.yml los fusiona solo cuando todas las
# comprobaciones de su commit han terminado bien, incluida la pila de correo
# con contenedores reales (stack.yml) si tocan los compose. Lo demás (versiones
# menores, y las de seguridad que no son un parche) llega en PR sueltos que
# revisa una persona.
#
# En cada servidor, «mailway update --auto» (sudo mailway auto-update on) aplica
# lo fusionado cada noche, lo comprueba y vuelve a la versión anterior si algo
# falla (docs/DESPLIEGUE-SKYWAY.md, sección 8.1).
version: 2
updates:
  # Un solo package-lock.json en la raíz para server/ y web/ (workspaces).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-npm:
        applies-to: version-updates
        update-types: [patch]
      seguridad-npm:
        applies-to: security-updates
        update-types: [patch]

  # Imagen base del panel (Dockerfile): Node con versión exacta.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-docker:
        update-types: [patch]
    ignore:
      # Un salto de versión mayor (Node 22 → 24) siempre a mano.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Motor, webmail, extractor y Traefik propio (deploy/docker-compose.*.yml).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-compose:
        update-types: [patch]
    ignore:
      # Stalwart solo recibe parches (0.15.x, que no migran los datos del
      # motor). La 0.16 eliminó la API REST de gestión que usa el driver: su
      # migración es un proyecto aparte, a mano (docs/PLAN.md, sección 6).
      - dependency-name: stalwartlabs/stalwart
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    groups:
      parches-actions:
        update-types: [patch]
